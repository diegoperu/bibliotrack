# BiblioTrack — nginx reverse proxy
# Sostituisci "tuodominio.it" con il tuo dominio (o "_" per qualsiasi host)
# Per HTTPS: usa certbot `sudo certbot --nginx -d tuodominio.it`

upstream bibliotrack_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;                 # ← sostituisci con il tuo dominio

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy        "strict-origin"  always;
    add_header Permissions-Policy     "camera=(self), microphone=()" always;
    # Abilita HSTS dopo aver configurato HTTPS con certbot:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none';" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 60M: POST /books/import accetta zip fino a 50MB (limite applicativo)
    client_max_body_size 60M;

    # ── Backend API routes ────────────────────────────────────────────────────
    location ~ ^/(auth|books|users|isbn|loans|health)(/.*)?$ {
        proxy_pass         http://bibliotrack_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Book covers (proxied + cached) ────────────────────────────────────────
    location ^~ /static/ {
        proxy_pass         http://bibliotrack_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 7d;
        add_header         Cache-Control "public, max-age=604800, immutable";
        # add_header in un location NON eredita quelli del server block: vanno ripetuti
        add_header         X-Content-Type-Options "nosniff" always;
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    root /opt/bibliotrack/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache JS/CSS assets (Vite adds content hash to filename)
    location ~* \.(js|css|woff2?|ttf|otf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # PWA manifest — no-cache so updates are picked up promptly
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
