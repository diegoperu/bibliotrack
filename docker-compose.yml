version: '3.8'

services:
  bibliotrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bibliotrack
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # OBBLIGATORIO: genera con `openssl rand -hex 32`
      SECRET_KEY: ${SECRET_KEY:-change-me-set-SECRET_KEY-env-var}
      # Utente admin creato al primo avvio (se DB non esiste)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@bibliotrack.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      # Token expiry
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS:   ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes: {}
