# BiblioTrack — nginx interno al container Docker
# Porta 8080, single-container (nginx + uvicorn via supervisor)

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"          always;
    add_header X-Content-Type-Options "nosniff"             always;
    add_header Referrer-Policy        "strict-origin"       always;
    add_header Permissions-Policy     "camera=(self), microphone=()" always;
    # CSP: script/style unsafe-inline needed for Vite build + React inline handlers
    # worker-src blob: needed for QuaggaJS Web Worker (ISBN scanner iOS fallback)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none';" always;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 60M: POST /api/books/import accetta zip fino a 50MB (limite applicativo)
    client_max_body_size 60M;

    # ── Backend API (strip /api prefix → uvicorn:8000) ────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Copertine (servite direttamente dal volume /data/covers) ─────────────
    location ^~ /static/covers/ {
        alias /data/covers/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # add_header in un location NON eredita quelli del server block: vanno ripetuti
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Frontend SPA (React, Vite build) ──────────────────────────────────────
    root /app/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache JS/CSS con content hash nel nome (immutable)
    location ~* \.(js|css|woff2?|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # PWA manifest — no-cache so updates are picked up promptly
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
